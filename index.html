<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權小達人 - 學習證書</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif TC & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }

        /* Certificate Background & Watermark Texture */
        .cert-bg {
            background-color: #fffdfa;
            background-image: 
                radial-gradient(#fde68a 1px, transparent 1px),
                radial-gradient(#fef3c7 1px, #fffdfa 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }

        /* Golden Ornate Frame Borders */
        .gold-double-border {
            border: 12px solid #fbbf24;
            outline: 3px double #d97706;
            outline-offset: -8px;
        }

        /* Golden Ribbon/Badge Effects */
        .gold-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #b45309 0%, #d97706 50%, #78350f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* PRINT OPTIMIZATION STYLES (@media print) */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .no-print {
                display: none !important;
            }

            .print-area {
                box-shadow: none !important;
                border-color: #d97706 !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 2.5rem !important;
                page-break-inside: avoid;
            }

            @page {
                size: A4 landscape;
                margin: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-800 flex flex-col justify-between items-center p-3 sm:p-6">

    <!-- TOP CONTROL & NAME INPUT PANEL (Hidden in Print) -->
    <div class="no-print w-full max-w-4xl bg-white/95 backdrop-blur-md border-2 border-amber-300 p-4 rounded-3xl shadow-xl mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- Name Input Box -->
        <div class="flex items-center gap-3 w-full sm:w-auto flex-1">
            <div class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl shrink-0">
                <i class="fa-solid fa-signature"></i>
            </div>
            <div class="flex-1">
                <label for="input-user-name" class="block text-xs font-black text-slate-500 uppercase">請輸入獲獎人姓名：</label>
                <input type="text" id="input-user-name" placeholder="請在此輸入您的姓名" maxlength="15" 
                    class="w-full bg-slate-50 border-2 border-amber-200 focus:border-amber-500 rounded-xl px-3 py-1.5 font-bold text-slate-800 text-sm sm:text-base focus:outline-none transition">
            </div>
        </div>

        <!-- Action Buttons (Print & Restart) -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
            <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-2xl transition text-sm flex items-center gap-2 active:scale-95 shadow-sm">
                <i class="fa-solid fa-rotate-left"></i>
                <span>重新挑戰</span>
            </a>
            <button id="btn-print" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black px-5 py-2.5 rounded-2xl transition text-sm flex items-center gap-2 shadow-md active:scale-95">
                <i class="fa-solid fa-print"></i>
                <span>下載 / 列印證書</span>
            </button>
        </div>
    </div>

    <!-- MAIN CERTIFICATE CANVAS AREA -->
    <main class="w-full max-w-4xl">
        <div id="certificate-card" class="print-area cert-bg gold-double-border rounded-3xl p-6 sm:p-12 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[540px] text-center">
            
            <!-- Corner Decorative Filigree SVGs -->
            <svg class="absolute top-3 left-3 w-16 h-16 text-amber-500/40 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
                <path d="M10,10 L40,10 A30,30 0 0,0 10,40 Z M15,15 L15,30 A15,15 0 0,1 30,15 Z"/>
            </svg>
            <svg class="absolute top-3 right-3 w-16 h-16 text-amber-500/40 pointer-events-none transform rotate-90" viewBox="0 0 100 100" fill="currentColor">
                <path d="M10,10 L40,10 A30,30 0 0,0 10,40 Z M15,15 L15,30 A15,15 0 0,1 30,15 Z"/>
            </svg>
            <svg class="absolute bottom-3 left-3 w-16 h-16 text-amber-500/40 pointer-events-none transform -rotate-90" viewBox="0 0 100 100" fill="currentColor">
                <path d="M10,10 L40,10 A30,30 0 0,0 10,40 Z M15,15 L15,30 A15,15 0 0,1 30,15 Z"/>
            </svg>
            <svg class="absolute bottom-3 right-3 w-16 h-16 text-amber-500/40 pointer-events-none transform rotate-180" viewBox="0 0 100 100" fill="currentColor">
                <path d="M10,10 L40,10 A30,30 0 0,0 10,40 Z M15,15 L15,30 A15,15 0 0,1 30,15 Z"/>
            </svg>

            <!-- CERTIFICATE HEADER -->
            <div class="space-y-3 z-10">
                <!-- Top Badge Label -->
                <div class="inline-flex items-center gap-2 bg-amber-100 border border-amber-300 text-amber-900 px-4 py-1 rounded-full text-xs font-black tracking-widest shadow-sm">
                    <i class="fa-solid fa-award text-amber-600"></i>
                    <span>聯合國 SDGs 永續學習認證</span>
                </div>

                <!-- Main Certificate Title -->
                <h1 class="serif-title text-3xl sm:text-5xl font-black tracking-tight text-slate-800 leading-tight">
                    學習榮譽證書
                </h1>
                <p class="text-xs sm:text-sm font-extrabold tracking-widest text-amber-700 uppercase">
                    CERTIFICATE OF ACHIEVEMENT
                </p>
                <div class="w-32 h-1 gold-gradient mx-auto rounded-full shadow-sm"></div>
            </div>

            <!-- CERTIFICATE BODY CONTENT -->
            <div class="my-6 space-y-4 z-10">
                <p class="text-xs sm:text-base font-semibold text-slate-600">茲證明學員</p>

                <!-- Recipient Name (Dynamic Render) -->
                <div class="py-1">
                    <span id="display-user-name" class="serif-title text-3xl sm:text-5xl font-black text-pink-600 border-b-2 border-pink-400 px-6 pb-1 inline-block min-w-[200px]">
                        平權學習者
                    </span>
                </div>

                <!-- Award Title & Description -->
                <div class="max-w-2xl mx-auto space-y-2">
                    <p class="text-sm sm:text-lg font-bold text-slate-800">
                        順利通過兩大關卡考驗，榮獲
                        <span class="text-gold-gradient font-black text-lg sm:text-2xl px-1">
                            「SDGs 性別平權小達人」
                        </span>
                        榮譽稱號
                    </p>
                    <p class="text-xs sm:text-sm font-medium text-slate-600 leading-relaxed px-4">
                        感謝您積極參與永續發展目標 (SDG 5) 的推廣，成功建立良好的性別平等價值觀，消除性別刻板印象，為打造包容、平等的社會做出卓越貢獻！
                    </p>
                </div>
            </div>

            <!-- CERTIFICATE FOOTER (SEAL & DATE) -->
            <div class="flex items-end justify-between border-t border-amber-200/80 pt-6 mt-4 z-10">
                
                <!-- Issue Date -->
                <div class="text-left space-y-1">
                    <p class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-wider">頒發日期 / Date</p>
                    <p id="display-date" class="text-xs sm:text-sm font-extrabold text-slate-700">2026 年 11 月 09 日</p>
                </div>

                <!-- Golden Emblem Seal -->
                <div class="relative flex items-center justify-center">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full gold-gradient shadow-xl border-4 border-white flex flex-col items-center justify-center text-white transform -rotate-12">
                        <i class="fa-solid fa-ribbon text-2xl sm:text-3xl mb-0.5"></i>
                        <span class="text-[9px] sm:text-[10px] font-black tracking-tighter uppercase">SDG 5 平權認證</span>
                    </div>
                </div>

                <!-- Organizing Unit -->
                <div class="text-right space-y-1">
                    <p class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-wider">認證單位 / Unit</p>
                    <p class="text-xs sm:text-sm font-extrabold text-slate-700">SDGs 永續教育小組</p>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER (Hidden in Print) -->
    <footer class="no-print w-full text-center p-4 text-xs font-semibold text-slate-400 mt-4">
        SDGs 性別平權學習體驗計畫 | 認證證書產生器
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const inputName = document.getElementById('input-user-name');
        const displayName = document.getElementById('display-user-name');
        const displayDate = document.getElementById('display-date');
        const btnPrint = document.getElementById('btn-print');

        // Dynamic Name Input Listener
        inputName.addEventListener('input', (e) => {
            const nameValue = e.target.value.trim();
            if (nameValue) {
                displayName.innerText = nameValue;
            } else {
                displayName.innerText = "平權學習者";
            }
        });

        // Set Current Today Date automatically
        function setCurrentDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            displayDate.innerText = `${year} 年 ${month} 月 ${day} 日`;
        }

        // Print Handler
        btnPrint.addEventListener('click', () => {
            window.print();
        });

        // Initialize Page
        window.onload = () => {
            setCurrentDate();
        };
    </script>
</body>
</html>
